<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Farmasi RS Indriati</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>

<body class="bg-gray-100 p-8 font-sans">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">Dashboard Farmasi</h1>

    <div class="flex gap-6">
        <!-- Kolom Antrean -->
        <div class="flex-1 bg-white p-4 rounded-lg shadow min-h-[500px]">
            <h2 class="text-xl font-bold mb-4 border-b-2 border-red-500 pb-2">Resep Masuk (Antre)</h2>
            <div id="antre" class="kanban-kolom space-y-3 min-h-[400px]"></div>
        </div>

        <!-- Kolom Diracik -->
        <div class="flex-1 bg-white p-4 rounded-lg shadow min-h-[500px]">
            <h2 class="text-xl font-bold mb-4 border-b-2 border-yellow-500 pb-2">Sedang Diracik</h2>
            <div id="diracik" class="kanban-kolom space-y-3 min-h-[400px]"></div>
        </div>

        <!-- Kolom Selesai -->
        <div class="flex-1 bg-white p-4 rounded-lg shadow min-h-[500px]">
            <h2 class="text-xl font-bold mb-4 border-b-2 border-green-500 pb-2">Siap Diambil</h2>
            <div id="selesai" class="kanban-kolom space-y-3 min-h-[400px]"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        // Fungsi mengambil dan merender data
        async function loadData() {
            const response = await fetch(`${API_URL}/resep`);
            const resep = await response.json();

            // Bersihkan kolom
            document.getElementById('antre').innerHTML = '';
            document.getElementById('diracik').innerHTML = '';
            document.getElementById('selesai').innerHTML = '';

            // Masukkan data ke kolom masing-masing
            resep.forEach(r => {
                const card = document.createElement('div');
                card.className = "bg-gray-50 border p-4 rounded shadow-sm cursor-grab active:cursor-grabbing";
                card.dataset.id = r.id; // Menyimpan ID resep di elemen HTML
                card.innerHTML = `
                <div class="font-bold text-lg">${r.pasien} <span class="text-sm text-gray-500">(${r.id})</span></div>
                <div class="text-gray-700 mt-2">${r.obat}</div>
                `;
                document.getElementById(r.status).appendChild(card);
            });
        }

        // Fungsi mengaktifkan Drag and Drop
        function initDragAndDrop() {
            const kolom = ['antre', 'diracik', 'selesai'];
            kolom.forEach(idKolom => {
                new Sortable(document.getElementById(idKolom), {
                    group: 'farmasi', // Memungkinkan kartu pindah antar kolom
                    animation: 150,
                    onEnd: async function (evt) {
                        const idResep = evt.item.dataset.id;
                        const statusBaru = evt.to.id; // Mendapatkan ID kolom tujuan

                        // Kirim perubahan ke backend API
                        await fetch(`${API_URL}/update-status`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id: idResep, status_baru: statusBaru })
                        });
                    },
                });
            });
        }

        // Jalankan saat halaman dimuat
        loadData().then(initDragAndDrop);
    </script>
</body>

</html>
